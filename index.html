<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Manager Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1115">
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-panel: #1a1d24;
            --border-color: #2a2e39;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header h2 { font-size: 1.1rem; color: #fff; font-weight: 600; }
        .sidebar-header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .nav-list {
            list-style: none;
            padding: 15px 10px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 12px 16px 4px 16px;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .nav-section-title:hover { color: var(--text-main); }
        
        .nav-item {
            padding: 8px 12px;
            margin-bottom: 3px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-item:hover { background-color: rgba(56, 189, 248, 0.08); color: var(--text-main); }
        .nav-item.active { background-color: var(--accent); color: #0f1115; font-weight: 600; }

        .nav-item-pinned {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-item-pinned:hover { background: rgba(56, 189, 248, 0.18); }

        .cruise-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .cruise-checkbox-label input { cursor: pointer; }

        .nav-item-inactive {
            padding: 8px 16px;
            margin-bottom: 3px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
            border: 1px dashed rgba(239, 68, 68, 0.2);
            transition: all 0.2s;
        }
        .nav-item-inactive:hover { background: rgba(239, 68, 68, 0.15); }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top-bar {
            height: 60px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .page-title { font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .sync-status { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
        .sync-status.warn { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
        .toolbar { display: flex; gap: 10px; align-items: center; }

        .btn {
            background-color: #262b36;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn:hover { background-color: #323846; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background-color: var(--accent); color: #0f1115; border: none; font-weight: 600; }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-view-toggle {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-weight: 600;
        }
        .btn-view-toggle:hover {
            background-color: rgba(56, 189, 248, 0.25);
        }

        .btn-danger-soft {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-danger-soft:hover { background-color: var(--danger); color: #fff; }

        .btn-success-soft {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 3px;
        }
        .btn-success-soft:hover { background-color: var(--success); color: #fff; }

        .content-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-header-flex {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-staff-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .card h3 { font-size: 1rem; color: var(--accent); margin: 0; }

        .staff-meta-field {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .staff-meta-field input {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 150px;
        }
        .staff-meta-field input:focus { outline: none; border-color: var(--accent); }
        .staff-meta-field input:disabled { opacity: 0.7; cursor: not-allowed; background-color: #121418; }

        .btn-edit-role {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent);
            width: 26px;
            height: 26px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit-role:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        .days-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            align-items: center;
        }
        .day-tab-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
        }
        .day-tab-wrapper.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
        }
        .day-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 4px;
        }
        .day-tab.active {
            color: var(--accent);
            font-weight: 600;
        }
        .crew-broadcast-checkbox {
            cursor: pointer;
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
        }

        .staff-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .staff-tab {
            background: #222630;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .staff-tab.active { background: #2b3342; color: #fff; border-color: var(--accent); }
        .staff-add-btn {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
        }
        .staff-add-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; vertical-align: top; }
        th { color: var(--text-muted); font-weight: 600; background-color: rgba(0,0,0,0.2); }

        input[type="text"], select, textarea.table-textarea {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus, textarea.table-textarea:focus { outline: none; border-color: var(--accent); }

        textarea.table-textarea {
            resize: both;
            min-height: 34px;
            height: 38px;
            line-height: 1.3;
        }

        .col-time input[type="text"] {
            width: 65px;
            text-align: center;
        }

        .header-meta-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .header-cruise-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
        }
        .header-input-port {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            flex-grow: 1;
        }
        .header-input-date {
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent);
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            width: 140px;
            text-align: center;
        }

        .col-all { width: 60px; text-align: center; }
        .col-time { width: 75px; }
        .col-event { width: 260px; }
        .col-venue { width: 160px; }
        .col-details { width: auto; }
        .col-action { width: 70px; text-align: center; }

        .btn-all {
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-all:hover { border-color: var(--accent); opacity: 0.8; }
        .btn-all.applied { background: var(--accent); color: #0f1115; border-color: var(--accent); }

        textarea.notes-textarea { min-height: 120px; resize: vertical; }

        .ipm-badge {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .ipm-badge select {
            background: transparent; border: none; color: inherit; font-weight: inherit; font-size: inherit; outline: none; cursor: pointer; text-transform: uppercase;
        }
        .ipm-badge select option { background: var(--bg-panel); color: var(--text-main); }

        .ipm-badge-sm {
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .ipm-badge-sm select {
            background: transparent; border: none; color: inherit; font-weight: inherit; font-size: inherit; outline: none; cursor: pointer; text-transform: uppercase;
        }
        .ipm-badge-sm select option { background: var(--bg-panel); color: var(--text-main); }

        .context-menu {
            position: fixed;
            z-index: 1000;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            min-width: 150px;
            padding: 4px;
            display: none;
        }
        .context-menu-item {
            padding: 8px 12px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover { background: rgba(56, 189, 248, 0.12); }
        .context-menu-item.danger { color: var(--danger); }
        .context-menu-item.danger:hover { background: rgba(239, 68, 68, 0.15); }

        @media print {
            sidebar, header.top-bar, .toolbar, .days-tabs, .staff-tabs, .btn, .btn-all, .btn-danger-soft, .btn-success-soft, .btn-edit-role, .context-menu { display: none !important; }
            body, main, .content-container { background: #fff !important; color: #000 !important; overflow: visible !important; height: auto !important; }
            .card { border: none !important; background: #fff !important; padding: 0 !important; margin: 0 !important; }
            input, select, textarea { border: none !important; background: transparent !important; color: #000 !important; -webkit-print-color-adjust: exact; resize: none !important; }
            .print-page-break { page-break-after: always; break-after: page; }
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="sidebar-header">
            <h2>Stage Manager</h2>
            <p>Operations Portal</p>
        </div>
        <ul class="nav-list" id="nav-menu">
            <li class="nav-section-title">Portals</li>
            <li id="menu-schedule" class="nav-item active" onclick="switchTab('schedule')">Stage Team Schedule</li>
            <li id="menu-crew-portal" class="nav-item" onclick="window.open('crew.html', '_blank')">Open Crew Portal ↗</li>
            <li id="menu-notes" class="nav-item" onclick="switchTab('notes')">Manager Notes</li>
            
            <div id="sidebar-inactive-section"></div>
            <div id="sidebar-pinned-cruise"></div>

            <div class="nav-section-title" onclick="toggleCruisesDropdown()">
                <span>Cruises (Itinerary)</span>
                <span id="cruises-arrow">▼</span>
            </div>
            <div id="sidebar-cruises-list" style="display: none; max-height: 250px; overflow-y: auto;"></div>
        </ul>
        <div class="sidebar-footer">
            <button class="btn" onclick="exportJSON()">Export JSON</button>
            <button class="btn" onclick="document.getElementById('import-file').click()">Import JSON</button>
            <button class="btn" onclick="clearBrowserCacheAndStorage()" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">Reset Storage / Cache</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importJSON(event)">
        </div>
    </sidebar>

    <main>
        <header class="top-bar">
            <div class="page-title">
                <span id="page-title-text">Stage Team Schedule</span>
                <span id="sync-status" class="sync-status">Checking Sync...</span>
            </div>
            <div class="toolbar" id="top-toolbar">
                <button class="btn btn-view-toggle" id="view-toggle-btn" onclick="toggleMasterView()">Switch to Master View</button>
                <button class="btn" onclick="printReport()">Print / PDF (Duplex)</button>
                <button class="btn btn-primary" id="save-btn" onclick="saveData()">Save & Sync</button>
            </div>
        </header>
        
        <div class="content-container" id="content-area"></div>
    </main>

    <div id="staff-context-menu" class="context-menu"></div>

        let appData = {
            currentTab: 'schedule',

        let undoStack = [];
        const MAX_HISTORY = 20;

        function setSyncBadge(text, isWarn = false) {
            const el = document.getElementById('sync-status');
            if (!el) return;
            el.textContent = text;
            el.className = isWarn ? 'sync-status warn' : 'sync-status';
        }

        function pushState() {
            const currentState = JSON.stringify(appData);
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === currentState) return;
            undoStack.push(currentState);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
        }

        function undoAction() {
            if (undoStack.length === 0) return;
            const previousState = undoStack.pop();
            if (previousState) {
                appData = JSON.parse(previousState);
                autoSave();
                render();
            }
        }

        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undoAction();
            }
        });

        window.addEventListener('click', function() {
            hideStaffContextMenu();
        });

        function getGlobalStaffMeta(staff) {
            if (!appData.globalStaffMeta[staff]) {
                appData.globalStaffMeta[staff] = { role: "", phone: "", ipm: "green", roleLocked: false };
            }
            if (appData.globalStaffMeta[staff].roleLocked === undefined) {
                appData.globalStaffMeta[staff].roleLocked = false;
            }
            return appData.globalStaffMeta[staff];
        }

        function getActiveCruiseObj() {
            if (!appData.cruises[appData.currentCruise]) {
                let itData = ITINERARY_DATABASE[appData.currentCruise];
                let totalDaysCount = itData ? Object.keys(itData.days).length : 6;
                
                appData.cruises[appData.currentCruise] = {
                    totalDays: totalDaysCount,
                    activeDay: 'DAY 1',
                    crewDay: 'DAY 1',
                    activeStaff: 'ALEX',
                    staffMembers: ["ALEX", "JOVAN", "NALA", "JOSEPH"],
                    inactiveStaffMembers: [],
                    dayMeta: {},
                    ipmByDay: {},
                    schedules: {}
                };
            }
            if (!appData.cruises[appData.currentCruise].crewDay) {
                appData.cruises[appData.currentCruise].crewDay = 'DAY 1';
            }
            return appData.cruises[appData.currentCruise];
        }

        function initAppData() {
            let cruise = getActiveCruiseObj();
            if (!cruise.staffMembers || !cruise.staffMembers.length) {
                if (!cruise.inactiveStaffMembers || !cruise.inactiveStaffMembers.length) {
                    cruise.staffMembers = ["ALEX", "JOVAN", "NALA", "JOSEPH"];
                } else {
                    cruise.staffMembers = [];
                }
            }
            if (!cruise.inactiveStaffMembers) cruise.inactiveStaffMembers = [];
            if (!appData.globalStaffMeta) appData.globalStaffMeta = {};
            if (!appData.currentCruisePinned) appData.currentCruisePinned = "OMA261217";
            if (appData.isMasterView === undefined) appData.isMasterView = false;
            if (!cruise.schedules) cruise.schedules = {};
            if (!cruise.ipmByDay) cruise.ipmByDay = {};
            if (!cruise.dayMeta) cruise.dayMeta = {};

            let allStaffNames = [...cruise.staffMembers, ...cruise.inactiveStaffMembers];
            allStaffNames.forEach(st => {
                let meta = getGlobalStaffMeta(st);
                if (!meta.ipmByDay) meta.ipmByDay = {};
            });

            let itinerariesForCruise = ITINERARY_DATABASE[appData.currentCruise] ? ITINERARY_DATABASE[appData.currentCruise].days : {};

            for (let i = 1; i <= cruise.totalDays; i++) {
                let dayName = `DAY ${i}`;
                if (!cruise.schedules[dayName]) cruise.schedules[dayName] = {};
                
                if (!cruise.dayMeta[dayName]) {
                    cruise.dayMeta[dayName] = itinerariesForCruise[dayName] || { port: `Port ${i}`, date: `2026-12-17` };
                } else {
                    if (itinerariesForCruise[dayName]) {
                        if (!cruise.dayMeta[dayName].port || cruise.dayMeta[dayName].port.startsWith("Port")) {
                            cruise.dayMeta[dayName].port = itinerariesForCruise[dayName].port;
                        }
                        if (!cruise.dayMeta[dayName].date) {
                            cruise.dayMeta[dayName].date = itinerariesForCruise[dayName].date;
                        }
                    }
                }

                if (!cruise.ipmByDay[dayName] || !IPM_COLORS[cruise.ipmByDay[dayName]]) {
                    cruise.ipmByDay[dayName] = 'green';
                }

                allStaffNames.forEach(staff => {
                    let sMeta = getGlobalStaffMeta(staff);
                    if (!sMeta.ipmByDay[dayName] || !IPM_COLORS[sMeta.ipmByDay[dayName]]) {
                        sMeta.ipmByDay[dayName] = 'green';
                    }

                    if (!cruise.schedules[dayName][staff]) {
                        cruise.schedules[dayName][staff] = [];
                    }
                });
            }
        }

        function resetToDefault() {
            if (!confirm("Are you sure you want to clear all rows for the current day?")) return;
            pushState();
            let cruise = getActiveCruiseObj();
            cruise.schedules[cruise.activeDay][cruise.activeStaff] = [];
            autoSave();
            render();
        }

        function clearAllRowsForStaff(staff) {
            if (!confirm(`Are you sure you want to clear all rows for ${staff} on this day?`)) return;
            pushState();
            let cruise = getActiveCruiseObj();
            if (cruise.schedules[cruise.activeDay]) {
                cruise.schedules[cruise.activeDay][staff] = [];
            }
            autoSave();
            render();
        }

        function clearBrowserCacheAndStorage() {
            if (confirm("Reset local storage and clear cached app state?")) {
                localStorage.removeItem('stage_manager_app_v43');
                location.reload(true);
            }
        }

        async function loadStorage() {
            const saved = localStorage.getItem('stage_manager_app_v43');
            if (saved) {
                try { appData = JSON.parse(saved); } catch(e) {}
            }
            initAppData();
            render();

            try {
                setSyncBadge("Syncing from Cloud...");
                let response = await fetch(API_URL, { cache: "no-store" });
                if (!response.ok) throw new Error("HTTP " + response.status);
                let cloudData = await response.json();
                if (cloudData && cloudData.cruises && Object.keys(cloudData).length > 0) {
                    appData = cloudData;
                    initAppData();
                    localStorage.setItem('stage_manager_app_v43', JSON.stringify(appData));
                    undoStack = [];
                    render();
                    cloudLoaded = true;
                    setSyncBadge("Cloud Connected");
                } else {
                    cloudLoaded = true;
                    // Cloud is empty: publish this device's schedule so the Crew Portal can load it.
                    await uploadToCloud();
                }
            } catch (e) {
                console.error("Cloud load failed:", e);
                setSyncBadge("Offline / Local Mode", true);
            }
        }

        let cloudSyncTimer = null;
        let cloudLoaded = false; // never upload before the shared copy has been read
        function autoSave() {
            localStorage.setItem('stage_manager_app_v43', JSON.stringify(appData));
            setSyncBadge("Unsaved Cloud Changes", true);
            // Automatically push changes to the cloud shortly after editing stops.
            clearTimeout(cloudSyncTimer);
            if (cloudLoaded) cloudSyncTimer = setTimeout(() => { uploadToCloud(); }, 1500);
        }

        async function uploadToCloud() {
            try {
                setSyncBadge("Uploading...");
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(appData)
                });
                if (!res.ok) throw new Error("Upload failed: " + res.status);
                setSyncBadge("Cloud Synced");
                return true;
            } catch (e) {
                console.error("Cloud upload failed:", e);
                setSyncBadge("Sync Error", true);
                return false;
            }
        }

        async function saveData() {
            clearTimeout(cloudSyncTimer);
            localStorage.setItem('stage_manager_app_v43', JSON.stringify(appData));

            let btn = document.getElementById('save-btn');
            if (btn) btn.textContent = "Syncing...";
            setSyncBadge("Uploading...");

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(appData)
                });
                if (!res.ok) throw new Error("Upload failed: " + res.status);
                setSyncBadge("Cloud Synced");
                if (btn) btn.textContent = "Saved!";
                setTimeout(() => { if (btn) btn.textContent = "Save & Sync"; }, 2000);
            } catch (err) {
                setSyncBadge("Sync Error", true);
                if (btn) btn.textContent = "Save & Sync";
                alert("Saved locally, but failed to upload to the cloud. Check your connection and try again.");
            }
        }

            if (field === 'ipm') {
                pushState();
                if (!meta.ipmByDay) meta.ipmByDay = {};
                meta.ipmByDay[getActiveCruiseObj().activeDay] = value;
                autoSave();
                render();
            } else {
                meta[field] = value;
                autoSave();
            }
        }

        function lockRole(staff) {
            pushState();
            getGlobalStaffMeta(staff).roleLocked = true;
            autoSave();
            render();
        }

        function unlockRole(staff) {
            pushState();
            getGlobalStaffMeta(staff).roleLocked = false;
            autoSave();
            render();
        }

        function hideStaffContextMenu() {
            const menu = document.getElementById('staff-context-menu');
            if (menu) menu.style.display = 'none';
        }

        function handleStaffRightClick(event, staff) {
            showStaffContextMenu(event, staff, false);
        }

        function handleInactiveStaffRightClick(event, staff) {
            showStaffContextMenu(event, staff, true);
        }

        function showStaffContextMenu(event, staff, isInactive) {
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('staff-context-menu');
            if (!menu) return;

            let html = isInactive 
                ? `<div class="context-menu-item" onclick="activateStaffMember('${staff}')">Activate</div>`
                : `<div class="context-menu-item" onclick="archiveStaffMember('${staff}')">Archive</div>`;
            html += `<div class="context-menu-item danger" onclick="deleteStaffMember('${staff}')">Delete</div>`;

            menu.innerHTML = html;
            menu.style.display = 'block';
            menu.style.left = `${Math.min(event.clientX, window.innerWidth - 160)}px`;
            menu.style.top = `${Math.min(event.clientY, window.innerHeight - 90)}px`;
        }

        function archiveStaffMember(staff) {
            hideStaffContextMenu();
            pushState();
            let cruise = getActiveCruiseObj();
            cruise.staffMembers = cruise.staffMembers.filter(s => s !== staff);
            if (!cruise.inactiveStaffMembers.includes(staff)) cruise.inactiveStaffMembers.push(staff);
            if (cruise.activeStaff === staff) {
                cruise.activeStaff = cruise.staffMembers[0] || cruise.inactiveStaffMembers[0] || "";
            }
            autoSave();
            render();
        }

        function activateStaffMember(staff) {
            hideStaffContextMenu();
            pushState();
            let cruise = getActiveCruiseObj();
            cruise.inactiveStaffMembers = cruise.inactiveStaffMembers.filter(s => s !== staff);
            if (!cruise.staffMembers.includes(staff)) cruise.staffMembers.push(staff);
            cruise.activeStaff = staff;
            autoSave();
            render();
        }

        function deleteStaffMember(staff) {
            hideStaffContextMenu();
            if (!confirm(`Delete crew member "${staff}" permanently?`)) return;
            pushState();
            let cruise = getActiveCruiseObj();
            cruise.staffMembers = cruise.staffMembers.filter(s => s !== staff);
            cruise.inactiveStaffMembers = cruise.inactiveStaffMembers.filter(s => s !== staff);
            Object.keys(cruise.schedules).forEach(day => {
                if (cruise.schedules[day]?.[staff]) delete cruise.schedules[day][staff];
            });
            if (cruise.activeStaff === staff) {
                cruise.activeStaff = cruise.staffMembers[0] || cruise.inactiveStaffMembers[0] || "";
            }
            autoSave();
            render();
        }

        function addStaffMember() {
            const name = prompt("Enter new staff member name:");
            if (!name) return;
            const cleanName = name.trim().toUpperCase();
            let cruise = getActiveCruiseObj();
            if (!cleanName || cruise.staffMembers.includes(cleanName) || cruise.inactiveStaffMembers.includes(cleanName)) {
                alert("Invalid or already existing staff member!");
                return;
            }
            pushState();
            cruise.staffMembers.push(cleanName);
            getGlobalStaffMeta(cleanName);
            cruise.activeStaff = cleanName;
            initAppData();
            autoSave();
            render();
        }

        function changeTotalDays(delta) {
            let cruise = getActiveCruiseObj();
            if (cruise.totalDays + delta < 1 || cruise.totalDays + delta > 30) return;
            pushState();
            cruise.totalDays += delta;
            let currentDayNum = parseInt(cruise.activeDay.replace('DAY ', ''));
            if (currentDayNum > cruise.totalDays) cruise.activeDay = `DAY ${cruise.totalDays}`;
            initAppData();
            autoSave();
            render();
        }

        function timeToMinutes(tStr) {
            if (!tStr || typeof tStr !== 'string' || !tStr.includes(':')) return 9999;
            let parts = tStr.trim().split(':');
            let h = parseInt(parts[0], 10);
            let m = parseInt(parts[1], 10);
            if (isNaN(h) || isNaN(m)) return 9999;
            if (h >= 0 && h < 4) h += 24;
            return h * 60 + m;
        }

        function updateRow(staff, index, field, value) {
            let cruise = getActiveCruiseObj();
            if (cruise.schedules[cruise.activeDay]?.[staff]?.[index]) {
                cruise.schedules[cruise.activeDay][staff][index][field] = value;
                autoSave();
            }
        }

        function handleTimeBlur(staff, index) {
            pushState();
            let cruise = getActiveCruiseObj();
            let rows = cruise.schedules[cruise.activeDay][staff];
            if (rows?.[index]) {
                rows.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
                autoSave();
                render();
            }
        }

        function removeRow(staff, index) {
            pushState();
            getActiveCruiseObj().schedules[getActiveCruiseObj().activeDay][staff].splice(index, 1);
            autoSave();
            render();
        }

        function addEmptyRowForStaff(staff) {
            pushState();
            let cruise = getActiveCruiseObj();
            if (!cruise.schedules[cruise.activeDay][staff]) cruise.schedules[cruise.activeDay][staff] = [];
            cruise.schedules[cruise.activeDay][staff].push({ time: "", event: "", venue: "Star Theatre", details: "", applied: false });
            autoSave();
            render();
        }

        function addEmptyRow() {
            addEmptyRowForStaff(getActiveCruiseObj().activeStaff);
        }

        function addRowBelow(staff, index) {
            pushState();
            let cruise = getActiveCruiseObj();
            let rows = cruise.schedules[cruise.activeDay][staff];
            let currentRow = rows[index];
            let nextTimeStr = "";
            if (currentRow?.time?.includes(':')) {
                let [h, m] = currentRow.time.split(':').map(v => parseInt(v, 10));
                if (!isNaN(h) && !isNaN(m)) {
                    let totalMins = (h * 60 + m + 15) % 1440;
                    nextTimeStr = String(Math.floor(totalMins / 60)).padStart(2, '0') + ':' + String(totalMins % 60).padStart(2, '0');
                }
            }
            rows.splice(index + 1, 0, { time: nextTimeStr, event: "", venue: currentRow ? currentRow.venue : "Star Theatre", details: "", applied: false });
            rows.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
            autoSave();
            render();
        }

        function applyToAllStaff(index, currentStaff) {
            let cruise = getActiveCruiseObj();
            let activeDay = cruise.activeDay;
            let sourceRow = cruise.schedules[activeDay][currentStaff][index];
            if (!sourceRow.event && !sourceRow.time) {
                alert("Please fill in Time and Event before applying to ALL.");
                return;
            }
            pushState();
            sourceRow.applied = true;
            cruise.staffMembers.forEach(staff => {
                if (staff === currentStaff) return;
                if (!cruise.schedules[activeDay][staff]) cruise.schedules[activeDay][staff] = [];
                let targetRows = cruise.schedules[activeDay][staff];
                let existing = targetRows.find(r => r.time === sourceRow.time && !r.event);
                let newRowData = { time: sourceRow.time, event: sourceRow.event, venue: sourceRow.venue, details: sourceRow.details, applied: true };
                if (existing) {
                    Object.assign(existing, newRowData);
                } else {
                    targetRows.push(newRowData);
                }
                targetRows.sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
            });
            autoSave();
            render();
        }

        function updateMeta(field, value) {
            let cruise = getActiveCruiseObj();
            if (!cruise.dayMeta[cruise.activeDay]) cruise.dayMeta[cruise.activeDay] = { port: "", date: "" };
            cruise.dayMeta[cruise.activeDay][field] = value;
            autoSave();
        }

        function updateIpmColor(val) {
            pushState();
            let cruise = getActiveCruiseObj();
            if (IPM_COLORS[val]) {
                cruise.ipmByDay[cruise.activeDay] = val;
                autoSave();
                render();
            }
        }

            let currentDay = cruise.activeDay;
            let currentMeta = cruise.dayMeta[currentDay] || { port: "", date: "" };
            
            let printHTML = `<div class="print-page-break"><h2>MASTER SCHEDULE SUMMARY — ${appData.currentCruise} | ${currentDay} (${currentMeta.date} | ${currentMeta.port})</h2><hr style="margin: 10px 0;">`;
            cruise.staffMembers.forEach(staff => {
                let sMeta = getGlobalStaffMeta(staff);
                let sIpmKey = sMeta.ipmByDay?.[currentDay] || 'green';
                printHTML += `<h4 style="margin-top:15px; color:#333;">Staff: ${staff} (${sMeta.role || 'No Role'}, Phone: ${sMeta.phone || 'N/A'}) | IPM: ${(IPM_COLORS[sIpmKey] || IPM_COLORS.green).label}</h4>`;
                printHTML += `<table border="1" style="width:100%; border-collapse:collapse; font-size:11px; margin-bottom:10px;"><tr><th>Time</th><th>Event</th><th>Venue</th><th>Details</th></tr>`;
                let sRows = cruise.schedules[currentDay]?.[staff] || [];
                let hasRows = false;
                sRows.forEach(r => {
                    if (r.time || r.event) {
                        hasRows = true;
                        printHTML += `<tr><td>${r.time || ''}</td><td>${r.event || ''}</td><td>${r.venue || ''}</td><td>${r.details || ''}</td></tr>`;
                    }
                });
                if (!hasRows) printHTML += `<tr><td colspan="4" style="text-align:center;">No entries</td></tr>`;
                printHTML += `</table>`;
            });
            printHTML += `</div>`;

            document.getElementById('content-area').innerHTML = printHTML;
            window.print();
            document.getElementById('content-area').innerHTML = originalContent;
            render();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "stage_manager_portal_backup.json");
            dl.click();
        }

        function importJSON(event) {
            const reader = new FileReader();
            if (event.target.files[0]) {
                reader.readAsText(event.target.files[0], "UTF-8");
                reader.onload = function(e) {
                    try {
                        appData = JSON.parse(e.target.result);
                        initAppData();
                        autoSave();
                        undoStack = [];
                        render();
                        alert('Data imported successfully!');
                    } catch(err) { alert('File read error'); }
                }
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        loadStorage();
    </script>
</body>
</html>
